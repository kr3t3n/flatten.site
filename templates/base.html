<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP File Flattener</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ZIP File Flattener</a>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-4 bg-dark border-top border-secondary">
        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div class="col-12 col-sm-auto mb-3 mb-sm-0">
                    <div class="d-flex justify-content-center justify-content-sm-start gap-4">
                        <a href="{{ url_for('terms') }}" class="text-muted text-decoration-none hover-text-primary">Terms</a>
                        <a href="{{ url_for('privacy') }}" class="text-muted text-decoration-none hover-text-primary">Privacy</a>
                        <a href="{{ url_for('contact') }}" class="text-muted text-decoration-none hover-text-primary">Contact</a>
                    </div>
                </div>
                <div class="col-12 col-sm-auto text-center text-sm-end">
                    <div class="d-flex flex-column flex-sm-row align-items-center gap-3">
                        <a href="https://www.buymeacoffee.com/georgipep" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="text-muted text-decoration-none hover-text-primary">
                            Like flatten.site? Show your love with a ☕
                        </a>
                        <p class="text-muted mb-0">
                            Created by 
                            <a href="https://x.com/georgipep" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="text-primary text-decoration-none hover-text-decoration-underline">
                                Georgi
                            </a>
                            <br class="d-sm-none">
                            <span class="d-none d-sm-inline"> - </span>
                            Mangia Studios Limited
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
