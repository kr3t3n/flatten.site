<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Easily flatten ZIP file hierarchies with path-based naming conventions. Free online tool for converting nested directories into flat structures.">
    <meta name="keywords" content="file hierarchy, flatten directories, path-based naming, zip file tools, file organization">
    <meta name="author" content="@georgipep">
    <meta property="og:title" content="flatten.site - File Hierarchy Flattening Tool">
    <meta property="og:description" content="Convert nested directories into flat paths with customizable delimiters. Secure, instant, and free to use.">
    <meta property="og:type" content="website">
    <title>flatten.site - File Hierarchy Flattening Tool</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        @import url('https://fonts.cdnfonts.com/css/helvetica-neue-55');
        .brand-text {
            font-family: 'Helvetica Neue Medium', sans-serif;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark bg-dark py-4">
        <div class="container">
            <div class="text-center w-100">
                <a class="navbar-brand d-flex align-items-center justify-content-center" href="/">
                    <img src="{{ url_for('static', filename='favicon.png') }}" alt="logo" class="me-3" height="72">
                    <span class="display-4 mb-0 brand-text">flatten.site</span>
                </a>
                <p class="text-secondary mb-0 mt-2">Transform nested file structures into organized, searchable paths</p>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-4 bg-dark">
        <div class="container">
            <div class="row justify-content-between align-items-center g-4">
                <div class="col-12 col-md-auto">
                    <div class="d-flex flex-column flex-md-row align-items-center gap-3">
                        <a href="{{ url_for('terms') }}" class="text-secondary text-decoration-none hover-text-primary">Terms</a>
                        <a href="{{ url_for('privacy') }}" class="text-secondary text-decoration-none hover-text-primary">Privacy</a>
                        <a href="{{ url_for('contact') }}" class="text-secondary text-decoration-none hover-text-primary">Contact</a>
                    </div>
                </div>
                <div class="col-12 col-md-auto">
                    <div class="d-flex flex-column flex-md-row align-items-center gap-3">
                        <a href="https://www.buymeacoffee.com/georgipep" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="btn btn-outline-primary btn-sm">
                           <i class="bi bi-cup-hot me-2"></i>Buy me a coffee
                        </a>
                        <div class="text-secondary small">
                            Created by 
                            <a href="https://x.com/georgipep" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="text-primary text-decoration-none hover-text-decoration-underline">
                                @georgipep
                            </a>
                            <span class="mx-2">|</span>
                            flatten.site
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
