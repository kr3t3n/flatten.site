{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Upload ZIP File</h4>
            </div>
            <div class="card-body">
                <div class="upload-container">
                    <form id="uploadForm" class="text-center">
                        <div class="mb-4">
                            <div class="drop-zone" id="dropZone">
                                <div class="drop-zone-prompt">
                                    <i class="fas fa-cloud-upload-alt mb-3"></i>
                                    <p>Drag & drop your ZIP file here or click to browse</p>
                                    <small class="text-muted">Maximum file size: 50MB</small>
                                </div>
                                <input type="file" id="fileInput" class="drop-zone-input" accept=".zip" hidden>
                            </div>
                        </div>
                        
                        <div id="fileInfo" class="mb-3" style="display: none;">
                            <p class="selected-file-name mb-2"></p>
                            <button type="submit" class="btn btn-primary">Process ZIP File</button>
                        </div>
                    </form>

                    <div id="progressContainer" class="progress mt-3" style="display: none;">
                        <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                    </div>

                    <div id="alertContainer" class="mt-3">
                        <!-- Alerts will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
