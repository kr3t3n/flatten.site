<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flatten.site - Hierarchy Flattener</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-box-seam me-2"></i>
                flatten.site
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-4 bg-dark border-top border-secondary">
        <div class="container">
            <div class="row justify-content-between align-items-center g-4">
                <div class="col-12 col-md-auto">
                    <div class="d-flex flex-column flex-md-row align-items-center gap-3">
                        <a href="{{ url_for('terms') }}" class="text-secondary text-decoration-none hover-text-primary">Terms</a>
                        <a href="{{ url_for('privacy') }}" class="text-secondary text-decoration-none hover-text-primary">Privacy</a>
                        <a href="{{ url_for('contact') }}" class="text-secondary text-decoration-none hover-text-primary">Contact</a>
                    </div>
                </div>
                <div class="col-12 col-md-auto">
                    <div class="d-flex flex-column flex-md-row align-items-center gap-3">
                        <a href="https://www.buymeacoffee.com/georgipep" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="btn btn-outline-primary btn-sm">
                           <i class="bi bi-cup-hot me-2"></i>Buy me a coffee
                        </a>
                        <div class="text-secondary small">
                            Created by 
                            <a href="https://x.com/georgipep" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="text-primary text-decoration-none hover-text-decoration-underline">
                                @georgipep
                            </a>
                            <span class="mx-2">|</span>
                            flatten.site
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
