<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip File Flattener</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h1 class="text-center mb-4">Zip File Flattener</h1>
                        
                        <div class="upload-container text-center p-4" id="dropZone">
                            <i class="bi bi-cloud-upload display-1"></i>
                            <p class="mt-3">Drag & drop your ZIP file here or click to browse</p>
                            <form id="uploadForm" class="mt-3">
                                <input type="file" id="fileInput" accept=".zip" class="d-none">
                                <button type="button" class="btn btn-secondary" id="browseButton">
                                    Choose File
                                </button>
                            </form>
                        </div>

                        <div id="fileInfo" class="mt-3 d-none">
                            <div class="alert alert-info">
                                <i class="bi bi-file-earmark-zip"></i>
                                <span id="fileName"></span>
                            </div>
                            <button type="button" class="btn btn-primary" id="processButton">
                                Process File
                            </button>
                        </div>

                        <div id="progressContainer" class="mt-3 d-none">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>

                        <div id="errorContainer" class="mt-3 d-none">
                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle"></i>
                                <span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
